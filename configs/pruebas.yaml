# =============================================================================
# TESTS: "What do you want to test?"
# =============================================================================
# Each test is ONLY a list of weights (0–1) over the variables of configs/variables.yaml.
#   weight 1          → that variable counts a lot
#   weight 0 / absent → that variable does not count for this test
#
# Adding a new test = adding a block here. No code changes needed.
# (The keys stay in Spanish — ruedas, perforacion… — because the app and the data use them.)
#
#   label          name shown in the app's "Test" menu
#   test_validity  sentence for the card: what Earth does NOT reproduce in this test
#
# ⚠️ ALL weights are [assumption]: set by the Science team.
#    Reasoned draft in docs/01_how_it_works.md §5.
# =============================================================================

pruebas:

  ruedas:
    label: "Wheels / mobility"
    weights: {slope_deg: 1.0, roughness_deg: 1.0, rock_abundance_pct: 0.8}
    test_validity: "Wheel load scales with m·g: test with a lightened vehicle (g_target / g_Earth)"

  navegacion:
    label: "Autonomous navigation / cameras"
    weights: {sun_elev_max_deg: 1.0, slope_deg: 0.5, roughness_deg: 0.5}
    test_validity: "On Earth shadows move ~30 times faster and the sky fills them with diffuse light"

  perforacion:
    label: "Drilling / sampling"
    weights: {lithology: 1.0, ice_depth_m: 0.7}
    test_validity: "The material can be reproduced; the subsurface temperature cannot"

  hielo:
    label: "Ice detection"
    weights: {ice_depth_m: 1.0, t_mean_K: 0.5}
    test_validity: "Lunar ice sits in vacuum; Earth ice under an atmosphere: sublimation is different"

  energia_termica:
    label: "Solar power and thermal control"
    weights: {sun_elev_max_deg: 0.8, t_mean_K: 1.0, t_max_K: 0.6}
    test_validity: "Earth never drops below ≈ −90 °C nor reaches the lunar noon (≈ +120 °C)"

  polvo:
    label: "Dust, seals and mechanisms (Mars)"
    weights: {dust_aod: 1.0}
    test_validity: "Martian air is ~60 times thinner: dust is lifted differently"

  habitat:
    label: "Habitat / human operations"
    weights: {t_mean_K: 0.6, caves: 0.4}
    test_validity: "Neither reduced gravity nor radiation are reproduced"

  comunicaciones:
    label: "Communications (line of sight)"
    weights: {roughness_deg: 1.0, slope_deg: 0.5}
    test_validity: "The geometry of the relief is reproduced"
