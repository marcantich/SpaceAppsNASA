# =============================================================================
# VARIABLES: la "ficha técnica" de cada sitio
# =============================================================================
# Lista ÚNICA de columnas que comparten las fichas de la Tierra, la Luna y Marte.
# Si una variable se añade aquí, el resto del código la recoge sola.
#
#   type       numeric  → nota por diferencia (abajo); categorical → nota = matrix[objetivo][tierra]
#   half_diff  NOTA SUAVE (la que usan la web y src/analogs/similarity.py):
#                  nota = 1 / (1 + (diferencia / half_diff)²)
#              → 1 si es igual, 0,5 con una diferencia de half_diff, 0,2 con 2×, 0,06 con 4×…
#              Nunca llega a 0: cuando la Tierra no alcanza el valor del objetivo (frío de Marte)
#              sigue ordenando lo más cercano por delante.
#   matrix     (numérica por clases, p. ej. hielo) parecido entre clases: matrix[objetivo][tierra]
#   tolerance  fórmula LINEAL antigua: nota = max(0, 1 − |Δ| / tolerance). Solo la usan las
#              variables sin half_diff y las herramientas viejas (comparador de app/comparator.js)
#   dimension  grupo de la variable (bloque `dimensions` al final): el índice pesa las DIMENSIONES,
#              no las variables, para que 3 temperaturas no cuenten 3 veces
#   criterion  POR QUÉ ese half_diff (físico, operativo o de medida)
#   sources    de dónde sale el número en cada cuerpo (null = no existe o no aplica)
#
# ⚠️ Los half_diff tienen un criterio escrito pero siguen siendo [supuesto]: falta validarlos
#    con análogos conocidos (docs/09: punto 9 del informe de criterios).
# ⚠️ Las fuentes marcadas [verificar] están identificadas pero no descargadas ni comprobadas.
# Ver docs/03_enfoque.md §2 para los cuidados de cada variable.
# =============================================================================

# Índice (web y src/analogs/similarity.py):
#   nota_dimensión = media ponderada de las notas de sus variables disponibles
#   índice_celda   = 100 · Σ W_d · nota_d / Σ W_d      (W_d = 1, o el mayor peso de la prueba en esa dimensión)
#   índice_zona    = (1 − area_weight) · índice_celda + area_weight · media de las 6 celdas vecinas
#                    (las vecinas fuera de la zona de búsqueda cuentan 0): premia zonas homogéneas de
#                    ~20 km donde cabe una campaña de campo. El ranking usa índice_zona.
dimensions:
  terrain:     {label: "Terrain"}
  thermal:     {label: "Thermal"}
  water:       {label: "Water & ice"}
  sky:         {label: "Sky & light"}
  composition: {label: "Composition"}

scoring:
  area_weight: 0.4                   # [supuesto] peso de las 6 vecinas en el índice del ranking

variables:

  slope_deg:
    label: "Pendiente"
    unit: "°"
    type: numeric
    tolerance: 5                     # [supuesto]
    dimension: terrain
    half_diff: 3                     # nota 0,5 con 3° de diferencia
    criterion: "Operativo: ~3° separa las clases de pendiente para un rover (0–3 llano, 3–8 suave, 8–15 moderada, > 15 fuerte; límite operativo de Curiosity ~20°) y es ~2× el error de pendiente entre MDE de ~460 m"
    note: "MISMA escala en los tres cuerpos (enfoque §2.2): píxeles de ~460–474 m, diferencias centrales (≈ 0,9 km), mediana ponderada por área en la celda H3"
    sources:
      moon:  "LRO LOLA GDR ldem_64, 64 px/° (~474 m) → src/analogs/moon.py (H3 res 4, ~12,3 km)"
      mars:  "MGS MOLA MEGDR 128 px/° (~463 m) + mapas polares → src/analogs/mars_grid.py (H3 res 5, ~9,1 km)"
      earth: "NOAA ETOPO 2022 15″ (~463 m), solo tierra → src/analogs/earth_grid.py (H3 res 6, ~6,5 km)"

  roughness_deg:
    label: "Rugosidad (RMS de la pendiente)"
    unit: "°"
    type: numeric
    tolerance: 3                     # [supuesto]
    dimension: terrain
    half_diff: 2                     # nota 0,5 con 2° de diferencia
    criterion: "Medida: ~2° es el ruido de la rugosidad RMS con MDE de ~460 m (MOLA con < 50 % de cobertura láser, ETOPO); diferencias menores no son significativas"
    note: "Paso alto: RMS de la pendiente tras quitar el plano (Marte, Tierra) o el gradiente medio (Luna, ≈ lo mismo) de la celda"
    sources:
      moon:  "LRO LOLA GDR ldem_64 (moon.py)"
      mars:  "MGS MOLA MEGDR 128 px/° (mars_grid.py)"
      earth: "NOAA ETOPO 2022 15″ (earth_grid.py)"

  rock_abundance_pct:
    label: "Abundancia de rocas"
    unit: "%"
    type: numeric
    tolerance: 10                    # [supuesto]
    dimension: terrain
    half_diff: 5                     # nota 0,5 con 5 % de diferencia
    criterion: "Operativo: 5 % de área cubierta de rocas cambia la densidad de obstáculos para un rover de forma apreciable (Golombek & Rapp 1997)"
    note: "Mejor que la inercia térmica, que depende de la presión del gas (enfoque §2.3)"
    sources:
      moon:  "Diviner dgdr_ra_avg_cyl_032 (60N–60S). En el polo NO existe → vacío (comprobado)"
      mars:  "THEMIS / TES rock abundance [verificar]"
      earth: "SoilGrids, fragmentos gruesos [verificar]"

  lithology:
    label: "Tipo de roca"
    unit: ""
    type: categorical
    categories: [basalt, anorthosite, other_igneous, sedimentary, evaporite, ice]
    matrix: {}                       # [supuesto] vacía → igual = 1, distinto = 0. La rellena Ciencia.
    sources:
      moon:  "Del FeO de Lunar Prospector GRS (2°, global): mucho hierro → basalto (mar), poco → anortosita (tierras altas). Detalle: mapa geológico USGS"
      mars:  "USGS Global Geologic Map of Mars (Tanaka et al., 2014) [verificar]"
      earth: "GLiM (Global Lithological Map) [verificar]"

  sun_elev_max_deg:
    label: "Elevación máxima del Sol"
    unit: "°"
    type: numeric
    tolerance: 3                     # [supuesto] (fórmula lineal antigua)
    dimension: sky
    half_diff: 10                    # nota 0,5 con 10° de diferencia
    criterion: "Físico: 10° de diferencia en la altura máxima del Sol cambia la irradiancia de mediodía en un panel horizontal ≲ 15 % (a media altura) y la longitud de las sombras ~2× con Sol bajo. Con 3° la búsqueda quedaba atada a la misma latitud"
    # Definition (closed 2026-11-14; used for Mars in src/analogs/mars_grid.py and for Earth in
    # src/analogs/earth.py): highest NOON Sun elevation over a whole year, flat horizon:
    #     h_max = 90° − max(0, |lat| − obliquity)
    # Noon elevation is 90° − |lat − δ|, with the Sun's declination δ between −obliquity and
    # +obliquity over the year → 90° inside the tropics (|lat| ≤ obliquity), otherwise the
    # summer-solstice value. Example: Phoenix 68.2°N on Mars → 90 − (68.2 − 25.19) = 47°.
    # Assumptions: flat horizon (no terrain shadowing), geometry only (no atmosphere), it is the
    # yearly MAXIMUM (not mean insolation or hours of daylight).
    # Moon poles: obliquity 1.54° keeps the Sun within ~3° of the horizon, so local relief decides
    # everything there (permanent shadow / near-permanent light): use an illumination map
    # (e.g. PGDA LPSR_80S_20MPP, in Marc's Moon kit) instead of this flat-horizon formula.
    note: "h_max = 90° − max(0, |lat| − obliquity), noon, whole year, flat horizon (see comment above)"
    sources:
      moon:  "calculated: obliquity 1.54° (poles: use an illumination map, see comment)"
      mars:  "calculated: obliquity 25.19°, planetocentric latitude"
      earth: "calculated: obliquity 23.44°"

  t_mean_K:
    label: "Temperatura media anual"
    unit: "K"
    type: numeric
    tolerance: 20                    # [supuesto]
    dimension: thermal
    half_diff: 15                    # nota 0,5 con 15 K de diferencia
    criterion: "Climático: ~15 K es la diferencia de temperatura media anual entre cinturones climáticos vecinos de la Tierra (polar ↔ subpolar ↔ templado). Ninguna celda de la Tierra llega a los ~210 K de Marte: la curva suave sigue ordenando (la meseta antártica por delante del Sahara)"
    note: "Diviner PRP da la media a 2 cm de profundidad; MODIS da la superficie: no es exactamente la misma magnitud [verificar]"
    sources:
      moon:  "LRO Diviner GCP: (día + noche)/2 del ciclo medio de la misión (moon.py)"
      mars:  "MGS TES MY26 (día) + MRO MCS MY31 (noche): (día + noche)/2 (mars_grid.py)"
      earth: "MODIS Aqua MYD11C3: (día + noche)/2 de las 12 medias mensuales 2019–2023 (earth_grid.py)"

  t_max_K:
    label: "Temperatura máxima anual"
    unit: "K"
    type: numeric
    tolerance: 30                    # [supuesto]
    dimension: thermal
    half_diff: 20                    # nota 0,5 con 20 K de diferencia
    criterion: "Climático: los extremos varían más que la media; 20 K ≈ amplitud entre el mes más cálido de dos desiertos de latitudes vecinas. Además Marte da un P95 y la Tierra una media mensual (unos K de sesgo)"
    sources:
      moon:  "LRO Diviner GCP: máximo del ciclo diurno medio (moon.py)"
      mars:  "MGS TES MY26: percentil 95 de los valores de la tarde (mars_grid.py)"
      earth: "MODIS Aqua MYD11C3 (13:30): mes más cálido de la climatología 2019–2023 (earth_grid.py). Es una media mensual, no un P95: sale unos K más baja que la definición de Marte"

  t_min_K:
    label: "Temperatura mínima anual"
    unit: "K"
    type: numeric
    tolerance: 30                    # [supuesto]
    dimension: thermal
    half_diff: 20                    # nota 0,5 con 20 K de diferencia
    criterion: "Climático: igual que la máxima (20 K entre cinturones vecinos en el mes más frío)"
    note: "Condición típica (mes/hora más fría de la climatología), no el récord"
    sources:
      moon:  "LRO Diviner GCP: mínimo del ciclo diurno medio (moon.py)"
      mars:  null                    # no exportada: para Marte se compara t_night_K
      earth: "MODIS Aqua MYD11C3 (01:30): mes más frío de la climatología 2019–2023 (earth_grid.py)"

  t_night_K:
    label: "Temperatura nocturna (media anual)"
    unit: "K"
    type: numeric
    tolerance: 20                    # [supuesto]
    dimension: thermal
    half_diff: 15                    # nota 0,5 con 15 K de diferencia
    criterion: "Climático: como la media anual (15 K entre cinturones vecinos)"
    note: "La temperatura que mejor comparten la Tierra y Marte: media anual de noche"
    sources:
      moon:  null                    # no exportada: para la Luna se compara t_min_K
      mars:  "MRO MCS DDR v6.2, MY31, ~03 h (mars_grid.py)"
      earth: "MODIS Aqua MYD11C3 (01:30), media anual 2019–2023 (earth_grid.py)"

  precip_mm_year:
    label: "Lluvia media anual (aridez)"
    unit: "mm/año"
    type: numeric
    tolerance: 250                   # [supuesto]
    dimension: water
    half_diff: 100                   # nota 0,5 con 100 mm/año
    criterion: "Clases de aridez (UNEP): hiperárido < 25 mm, árido 25–200, semiárido 200–500. Con objetivo 0 (Marte, Luna), 100 mm/año = mitad del rango árido → nota 0,5"
    note: "En la Luna y Marte vale 0: mide cuánto se aleja la Tierra de un ambiente sin agua líquida"
    sources:
      moon:  "0 (no llueve)"
      mars:  "0 (no llueve)"
      earth: "GPM IMERG mensual v07, media 2019–2023"

  ice_depth_m:
    label: "Profundidad del hielo"
    unit: "m"
    type: numeric
    tolerance: 0.5                   # [supuesto] (fórmula lineal antigua)
    dimension: water
    # Clases (0,5 = en el primer metro · 3 = 1–5 m · 5 = > 5 m · 10 = sin hielo): parecido por matriz,
    # no por diferencia. Fila = objetivo, columna = Tierra.
    matrix:
      0.5: {0.5: 1.0, 3: 0.5, 5: 0.25, 10: 0.0}
      3:   {0.5: 0.5, 3: 1.0, 5: 0.6,  10: 0.1}
      5:   {0.5: 0.25, 3: 0.6, 5: 1.0, 10: 0.3}
      10:  {0.5: 0.0, 3: 0.1, 5: 0.3,  10: 1.0}
    criterion: "Operativo, por alcance de instrumentos: ≤ 1 m lo ven neutrones/radar y lo saca un taladro corto; 1–5 m necesita taladro profundo; > 5 m y 'sin hielo' son casi equivalentes para operaciones de superficie"
    note: "Analogía PARCIAL: en la Luna el hielo sublima al vacío; en la Tierra hay atmósfera"
    sources:
      moon:  "LRO Diviner PRP, profundidad de estabilidad del hielo (polo sur ≤ −80°); |lat| < 60°: sin hielo (supuesto). Metros continuos; 10 = no (moon.py)"
      mars:  "SWIM 2.0 (±60°) + neutrones GRS + supuesto al N de 70° (mars_grid.py). Clases 0,5 / 3 / 5 / 10"
      earth: "Estimada: hielo permanente MCD12C1 → 0 m; permafrost (LST media < 0 °C) → capa activa por Stefan E·√(grados-día de deshielo), E = 0,035 [supuesto]; si no, 10 m. Clases como Marte (earth_grid.py). Validar con ESA CCI Permafrost"
    # Las tres fichas traen además ice_depth_source (de dónde sale el valor en cada celda: medido, modelo o supuesto)

  dust_aod:
    label: "Polvo en suspensión (espesor óptico)"
    unit: ""
    type: numeric
    tolerance: 0.2                   # [supuesto]
    dimension: sky
    half_diff: 0.15                  # nota 0,5 con 0,15 de diferencia
    criterion: "Atmosférico: el fondo de Marte es τ ≈ 0,3–0,6 (tormentas > 1) y los desiertos de la Tierra τ ≈ 0,1–0,5; 0,15 ≈ la diferencia entre un desierto limpio y uno polvoriento"
    sources:
      moon:  null
      mars:  "MGS TES MY26, 9,3 µm × 2,6 → visible (mars_grid.py)"
      earth: "NASA MERRA-2 M2TMNXAER, DUEXTTAU (solo polvo, 550 nm), media anual 2019–2023 (earth_grid.py)"

  silica_wt_pct:
    label: "Sílice (SiO₂)"
    unit: "% peso"
    type: numeric
    tolerance: 5                     # [supuesto]
    dimension: composition
    half_diff: 5                     # nota 0,5 con 5 % de diferencia
    criterion: "Geológico: 5 % de SiO₂ separa familias de roca (basalto 45–52 %, andesita 52–63 %, granito ~70 %). Aún no se compara: Marte no exporta grs_si"
    note: "Composición de la superficie expuesta. Basalto ~45–52 %, granito ~70 %, arena de cuarzo > 90 %"
    sources:
      moon:  "Lunar Prospector GRS, SiO₂ (2°, ~60 km) [verificar unidades] (moon.py)"
      mars:  "Mars Odyssey GRS, Si (5°) × 2,139 → SiO₂ [verificar] — PENDIENTE: mars_grid.py lo calcula (grs_si) pero la web no lo exporta"
      earth: "ECOSTRESS ECO_L3G_WPS (0,01°, 53° N–53° S) (earth_grid.py)"

  snow_cover_pct:
    label: "Nieve (cobertura media anual)"
    unit: "%"
    type: numeric
    tolerance: 30                    # [supuesto]
    dimension: water
    half_diff: 20                    # nota 0,5 con 20 % de diferencia
    criterion: "Cobertura: 20 puntos de cobertura media anual ≈ dos meses más o menos de suelo nevado"
    note: "Solo Tierra de momento: sirve para filtrar o para buscar a mano (hielo superficial)"
    sources:
      moon:  null
      mars:  "Escarcha estacional de CO₂/H₂O [verificar]"
      earth: "MODIS MOD10CM, climatología 2019–2023"

  caves:
    label: "Cuevas o tubos de lava (0 = no, 1 = sí)"
    unit: ""
    type: numeric
    tolerance: 1                     # igual → 1, distinto → 0
    dimension: terrain
    sources:
      moon:  "LROC Pits Atlas (278 pozos, global). 0 al sur de −80° (comprobado)"
      mars:  "Mars Global Cave Candidate Catalog, MGC³ (USGS) [verificar]"
      earth: "Proxy: campos volcánicos basálticos (Smithsonian GVP + GLiM) [verificar]"

# -----------------------------------------------------------------------------
# OPERABILIDAD: solo existe en la Tierra. NO entra en el parecido; sirve de filtro
# ("enséñame solo sitios accesibles") y para el gráfico parecido vs. accesibilidad.
# -----------------------------------------------------------------------------
operability:
  travel_time_h:
    label: "Tiempo de viaje a la ciudad más cercana"
    unit: "h"
    source: "Weiss et al. (2018), Nature [verificar]"
  protected_area:
    label: "Zona protegida (0 = no, 1 = sí)"
    unit: ""
    source: "WDPA (World Database on Protected Areas) [verificar]"

# -----------------------------------------------------------------------------
# LO QUE LA TIERRA NO PUEDE REPRODUCIR: bloque fijo en cada ficha (enfoque §5)
# -----------------------------------------------------------------------------
bodies:
  moon:
    label: "Luna"
    gravity_m_s2: 1.62
    surface_pressure_Pa: 0           # ~vacío (exosfera)
    solar_day_h: 708.7               # 29,53 días
  mars:
    label: "Marte"
    gravity_m_s2: 3.71
    surface_pressure_Pa: 610         # media; varía con la estación
    solar_day_h: 24.66               # 1 sol
  earth:
    label: "Tierra"
    gravity_m_s2: 9.81
    surface_pressure_Pa: 101325
    solar_day_h: 24.0
