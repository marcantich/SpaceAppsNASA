<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earth Analogs — Moon & Mars</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/intro.css" /><!-- [intro] -->
  </head>
  <body>
    <!-- [intro] Opening screen: shown at once; src/intro.js removes it when the user presses Enter or clicks / taps -->
    <div id="intro" class="intro" role="status" aria-label="Loading the app">
      <canvas class="intro-stars" aria-hidden="true"></canvas>
      <div class="intro-bodies" aria-hidden="true">
        <div class="intro-body"><div class="intro-globe moon" style="background-image: url('./data/intro/moon.jpg')"></div><span>Moon</span></div>
        <div class="intro-body"><div class="intro-globe earth" style="background-image: url('./data/intro/earth.jpg')"></div><span>Earth</span></div>
        <div class="intro-body"><div class="intro-globe mars" style="background-image: url('./data/intro/mars.jpg')"></div><span>Mars</span></div>
      </div>
      <div class="intro-text">
        <h1>Earth Analogs</h1>
        <p class="sub">Where on Earth can we rehearse the Moon and Mars?</p>
        <p class="team">by <b>TRENCALOS</b></p>
      </div>
      <div class="intro-load">
        <div class="intro-bar"><i></i></div>
        <p>Loading the three worlds</p>
      </div>
    </div>
    <header class="toolbar">
      <h1>Analogs</h1>
      <div class="bodies">
        <span class="lbl">Click on</span>
        <div class="switch" id="left-body" role="group" aria-label="Body you click on (left)">
          <button type="button" data-body="mars" class="active">Mars</button>
          <button type="button" data-body="moon">Moon</button>
          <button type="button" data-body="earth">Earth</button>
        </div>
        <button type="button" id="swap" class="swap" title="Swap the two globes (the selected analog becomes the clicked point)" aria-label="Swap">⇄</button>
        <span class="lbl">search</span>
        <div class="switch" id="right-body" role="group" aria-label="Body where analogs are searched (right)">
          <button type="button" data-body="earth" class="active">Earth</button>
          <button type="button" data-body="mars">Mars</button>
          <button type="button" data-body="moon">Moon</button>
        </div>
      </div>
      <label class="relief">
        <input type="checkbox" id="relief" />
        Relief
      </label>
      <label class="test" title="What do you want to test? (weights from configs/pruebas.yaml)">
        Test
        <select id="prueba">
          <option value="">All shared variables</option>
        </select>
      </label>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
        <input id="place-search" type="search" autocomplete="off" spellcheck="false"
          placeholder="Search a base, site, region or lat, lon…"
          role="combobox" aria-controls="place-results" aria-autocomplete="list" />
        <ul id="place-results" class="suggest" role="listbox" hidden></ul>
      </div>
      <div class="zone" id="zone">
        <button type="button" class="zone-btn" aria-haspopup="true" aria-expanded="false"
          title="Search the best analogs only inside a region">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" /></svg>
          Zone: <b class="zone-name">Whole Earth</b> <span class="caret">▾</span>
        </button>
        <button type="button" class="zone-clear" title="Search the whole body again" aria-label="Clear zone" hidden>×</button>
        <div class="menu" role="menu" hidden></div>
      </div>
    </header>

    <main class="panes">
      <section class="pane" id="pane-left">
        <span class="pane-label" id="left-label">Mars · click a point</span>
        <div id="globe-left" class="globe"></div>
        <aside id="card-left" class="card side-left" hidden aria-live="polite"></aside>
      </section>
      <section class="pane" id="pane-right">
        <span class="pane-label" id="right-label">Earth · analogs</span>
        <div id="globe-right" class="globe"></div>
        <section id="results" class="results-bar" hidden aria-live="polite"></section>
        <aside id="card-right" class="card" hidden aria-live="polite"></aside>
      </section>
      <section id="dock" class="dock" hidden aria-live="polite"></section>
      <div id="status" class="status" hidden></div>
    </main>

    <script type="module" src="/src/intro.js"></script><!-- [intro] -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
