<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earth Analogs — Moon & Mars</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <h1>Earth Analogs</h1>
      <div class="switch" role="group" aria-label="Target body">
        <button type="button" data-body="mars" class="active">Mars</button>
        <button type="button" data-body="moon">Moon</button>
      </div>
      <label class="relief">
        <input type="checkbox" id="relief" />
        Relief
      </label>
      <label class="test" title="What do you want to test? (weights from configs/pruebas.yaml)">
        Test
        <select id="prueba">
          <option value="">All shared variables</option>
        </select>
      </label>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
        <input id="place-search" type="search" autocomplete="off" spellcheck="false"
          placeholder="Search a base, site, region or lat, lon…"
          role="combobox" aria-controls="place-results" aria-autocomplete="list" />
        <ul id="place-results" class="suggest" role="listbox" hidden></ul>
      </div>
      <div class="zone" id="zone">
        <button type="button" class="zone-btn" aria-haspopup="true" aria-expanded="false"
          title="Search the best Earth analogs only inside a region">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" /></svg>
          Zone: <b class="zone-name">Whole Earth</b> <span class="caret">▾</span>
        </button>
        <button type="button" class="zone-clear" title="Search the whole Earth again" aria-label="Clear zone" hidden>×</button>
        <div class="menu" role="menu" hidden></div>
      </div>
      <span class="hint">Click any point of the target body → best Earth analogs</span>
    </header>

    <main class="panes">
      <section class="pane">
        <span class="pane-label" id="target-label">Mars</span>
        <div id="target" class="globe"></div>
        <aside id="card" class="card" hidden aria-live="polite"></aside>
      </section>
      <section class="pane">
        <span class="pane-label">Earth</span>
        <div id="earth" class="globe"></div>
        <aside id="earth-results" class="card results" hidden aria-live="polite"></aside>
        <aside id="earth-card" class="card" hidden aria-live="polite"></aside>
        <div id="earth-status" class="status" hidden></div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
