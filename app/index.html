<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earth Analogs — Moon & Mars</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <h1>Earth Analogs</h1>
      <div class="switch" role="group" aria-label="Target body">
        <button type="button" data-body="mars" class="active">Mars</button>
        <button type="button" data-body="moon">Moon</button>
      </div>
      <label class="relief">
        <input type="checkbox" id="relief" />
        Relief
      </label>
      <label class="test" title="What do you want to test? (weights from configs/pruebas.yaml)">
        Test
        <select id="prueba">
          <option value="">All shared variables</option>
        </select>
      </label>
      <div class="zone" role="group" aria-label="Earth search zone">
        <label class="test" title="Search the best analogs only inside this region of Earth">
          Earth zone
          <select id="zone">
            <option value="">Whole Earth</option>
          </select>
        </label>
        <button type="button" id="draw-zone" title="Drag a box on the Earth globe to search only inside it (Esc cancels)">▭ Draw area</button>
      </div>
      <span class="hint">Click any point of the target body → best Earth analogs</span>
    </header>

    <main class="panes">
      <section class="pane">
        <span class="pane-label" id="target-label">Mars</span>
        <div id="target" class="globe"></div>
        <aside id="card" class="card" hidden aria-live="polite"></aside>
      </section>
      <section class="pane">
        <span class="pane-label">Earth</span>
        <div id="earth" class="globe"></div>
        <aside id="earth-results" class="card results" hidden aria-live="polite"></aside>
        <aside id="earth-card" class="card" hidden aria-live="polite"></aside>
        <div id="earth-status" class="status" hidden></div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
